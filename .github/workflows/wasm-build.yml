on: [push, pull_request]
name: WASM Build
jobs:
  wasm-build:
    strategy:
      matrix:
        go-version: [1.25.x, 1.26.x]
    runs-on: ubuntu-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Build for js/wasm
        env:
          GOOS: js
          GOARCH: wasm
        run: go build ./...
