on: [push, pull_request]
name: Unittests
jobs:
  test:
    strategy:
      matrix:
        go-version: [1.26.x, 1.27.x]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Test
        run: go test -race ./...
      # Integration tests need a real SAP system and do not run in CI, but they
      # must still compile. The 'integration transport' tag set includes every
      # file built with 'integration' alone, so one vet covers both (#230).
      - name: Vet integration tests
        run: go vet -tags='integration transport' ./...
